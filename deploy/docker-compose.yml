# One-box production layout: Caddy terminates TLS with an automatic Let's Encrypt certificate
# and proxies wss:// to the game server, which stays on the private network.
#
#   cp .env.example .env   # fill in the values
#   docker compose up -d
#   curl https://play.example.com/healthz

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "7788"
      HEALTH_PORT: "7789"
    expose:
      - "7788"
      - "7789"
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 1g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [aether]

networks:
  aether:

volumes:
  caddy_data:
  caddy_config:

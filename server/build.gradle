apply plugin: 'application'
apply plugin: 'org.jetbrains.kotlin.jvm'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
kotlin {
    compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
}

application {
    mainClass = 'com.mythron.aethertides.server.MainKt'
}

dependencies {
    implementation project(':shared')
    implementation "org.java-websocket:Java-WebSocket:$wsVersion"
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.register('fatJar', Jar) {
    // The runtime classpath contains :shared's jar, so this task consumes another task's
    // output. Without the explicit dependency Gradle happens to order it correctly on a
    // serial build and fails validation the moment anything runs in parallel.
    dependsOn configurations.runtimeClasspath
    archiveBaseName = 'aether-tides-server'
    manifest { attributes 'Main-Class': 'com.mythron.aethertides.server.MainKt' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}
